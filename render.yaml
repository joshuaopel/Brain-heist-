services:
  - type: web
    name: brain-heist-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DISCORD_CLIENT_SECRET
        sync: false   # set this manually in Render dashboard
    autoDeploy: true
