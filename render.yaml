services:
  - type: web
    name: brain-heist-server
    runtime: node
    buildCommand: npm install && npm run build --workspace=shared && VITE_BASE_PATH=/ VITE_SERVER_URL= npm run build --workspace=client && npm run build --workspace=server
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DISCORD_CLIENT_SECRET
        sync: false
    autoDeploy: true
